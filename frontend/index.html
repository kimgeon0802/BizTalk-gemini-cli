<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizTone Converter - 업무 말투 변환기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans antialiased bg-gray-100 text-gray-800 leading-normal">
    <div class="container mx-auto p-4 md:p-8 bg-white rounded-lg shadow-xl my-8 max-w-4xl">
        <header class="text-center pb-6 mb-8 border-b border-gray-200">
            <h1 class="text-4xl font-extrabold text-gray-900 mb-2">BizTone Converter</h1>
            <p class="text-lg text-gray-600">직장인을 위한 AI 기반 업무 말투 변환 솔루션</p>
        </header>

        <main class="flex flex-col md:flex-row gap-6 mb-8">
            <div class="w-full md:w-1/2 p-6 bg-white rounded-xl shadow-lg border border-gray-200 flex flex-col">
                <h2 class="text-2xl font-semibold text-gray-800 mb-4 pb-3 border-b border-gray-200">원문 입력</h2>
                <textarea id="original-text" placeholder="여기에 변환할 텍스트를 입력하세요. (최대 500자)" maxlength="500"
                          class="w-full h-48 p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 ease-in-out text-lg resize-y font-medium"></textarea>
                <div class="text-right text-sm text-gray-500 mt-2">
                    <span id="current-char-count">0</span> / 500
                </div>

                <div class="mt-6 mb-4">
                    <h3 class="text-lg font-medium text-gray-700 mb-3">변환 대상 선택:</h3>
                    <div class="flex flex-wrap gap-3">
                        <input type="radio" id="target-upward" name="target" value="상사" class="hidden" checked>
                        <label for="target-upward" class="flex-grow text-center px-5 py-2 text-base font-medium rounded-full cursor-pointer transition-all duration-200 ease-in-out
                                                      bg-gray-200 text-gray-700 hover:bg-gray-300
                                                      peer-checked:bg-blue-600 peer-checked:text-white peer-checked:hover:bg-blue-700">상사</label>

                        <input type="radio" id="target-lateral" name="target" value="타팀 동료" class="hidden">
                        <label for="target-lateral" class="flex-grow text-center px-5 py-2 text-base font-medium rounded-full cursor-pointer transition-all duration-200 ease-in-out
                                                      bg-gray-200 text-gray-700 hover:bg-gray-300
                                                      peer-checked:bg-blue-600 peer-checked:text-white peer-checked:hover:bg-blue-700">타팀 동료</label>

                        <input type="radio" id="target-external" name="target" value="고객" class="hidden">
                        <label for="target-external" class="flex-grow text-center px-5 py-2 text-base font-medium rounded-full cursor-pointer transition-all duration-200 ease-in-out
                                                      bg-gray-200 text-gray-700 hover:bg-gray-300
                                                      peer-checked:bg-blue-600 peer-checked:text-white peer-checked:hover:bg-blue-700">고객</label>
                    </div>
                </div>

                <button id="convert-button" class="w-full py-3 px-6 mt-4 text-xl font-bold text-white bg-blue-600 rounded-lg
                                                  hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 focus:outline-none
                                                  transition-all duration-200 ease-in-out shadow-md">변환하기</button>
            </div>

            <div class="w-full md:w-1/2 p-6 bg-white rounded-xl shadow-lg border border-gray-200 flex flex-col">
                <h2 class="text-2xl font-semibold text-gray-800 mb-4 pb-3 border-b border-gray-200">변환 결과</h2>
                <div id="converted-text-display" class="w-full h-48 p-4 bg-gray-50 border border-gray-300 rounded-lg text-lg text-gray-800
                                                    overflow-y-auto whitespace-pre-wrap break-words font-medium">변환된 텍스트가 여기에 표시됩니다.</div>
                <button id="copy-button" class="w-full py-3 px-6 mt-4 text-xl font-bold text-gray-800 bg-gray-300 rounded-lg
                                                hover:bg-gray-400 focus:ring-4 focus:ring-gray-200 focus:outline-none
                                                transition-all duration-200 ease-in-out shadow-md" disabled>복사하기</button>
                <div class="text-center mt-6 pt-5 border-t border-gray-200">
                    <p class="text-gray-600 mb-3 text-base">변환 결과가 만족스러우신가요?</p>
                    <div class="flex justify-center gap-4">
                        <button class="feedback-btn px-6 py-2 bg-green-100 text-green-700 rounded-full text-base font-semibold
                                       hover:bg-green-200 transition-colors duration-200 ease-in-out" data-feedback="helpful">👍 도움됨</button>
                        <button class="feedback-btn px-6 py-2 bg-red-100 text-red-700 rounded-full text-base font-semibold
                                       hover:bg-red-200 transition-colors duration-200 ease-in-out" data-feedback="not-helpful">👎 도움 안 됨</button>
                    </div>
                </div>
            </div>
        </main>

        <footer class="text-center mt-8 pt-6 border-t border-gray-200 text-gray-500 text-sm">
            <p>&copy; 2026 BizTone Converter. All rights reserved.</p>
        </footer>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
